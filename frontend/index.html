<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>r3f — AI Game Maker (UI)</title>
    <style>
      body { font-family: system-ui, Arial; margin: 24px; }
      textarea { width: 100%; height: 120px; }
      pre { background: #f6f8fa; padding: 12px; border-radius: 6px; }
      ul { padding-left: 20px; }
    </style>
  </head>
  <body>
    <h1>r3f — AI Game Maker (UI)</h1>
    <p>Type a description of the game you want and click Generate.</p>
    <textarea id="prompt" placeholder="e.g. Create a small 2D platformer with double jump and 3 enemy types"></textarea>
    <div style="margin-top:8px">
      <button id="generate">Generate</button>
      <button id="assemble">Generate & Assemble</button>
      <span id="status" style="margin-left:12px"></span>
    </div>

    <h2>Result</h2>
    <pre id="result">No output yet.</pre>

    <h2>Artifacts</h2>
    <div>
      <button id="refresh">Refresh</button>
      <ul id="artifacts"></ul>
    </div>

    <script>
      const generateBtn = document.getElementById('generate')
      const assembleBtn = document.getElementById('assemble')
      const refreshBtn = document.getElementById('refresh')
      const promptEl = document.getElementById('prompt')
      const resultEl = document.getElementById('result')
      const statusEl = document.getElementById('status')
      const artifactsEl = document.getElementById('artifacts')

      async function post(path, body) {
        statusEl.textContent = 'Sending...'
        try {
          const res = await fetch('http://localhost:8000' + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          })
          const data = await res.json()
          statusEl.textContent = 'Done'
          return data
        } catch (err) {
          statusEl.textContent = 'Error'
          throw err
        }
      }

      generateBtn.onclick = async () => {
        const prompt = promptEl.value.trim()
        if (!prompt) return alert('Please enter a prompt')
        try {
          const data = await post('/generate', { prompt })
          resultEl.textContent = JSON.stringify(data, null, 2)
        } catch (err) {
          resultEl.textContent = String(err)
        }
      }

      assembleBtn.onclick = async () => {
        const prompt = promptEl.value.trim()
        if (!prompt) return alert('Please enter a prompt')
        try {
          const data = await post('/generate_and_assemble', { prompt })
          resultEl.textContent = JSON.stringify(data, null, 2)
          refreshArtifacts()
        } catch (err) {
          resultEl.textContent = String(err)
        }
      }

      async function refreshArtifacts() {
        artifactsEl.innerHTML = 'Loading...'
        try {
          const res = await fetch('http://localhost:8000/artifacts')
          const data = await res.json()
          artifactsEl.innerHTML = ''
          if (!data.artifacts || data.artifacts.length === 0) {
            artifactsEl.innerHTML = '<li>No artifacts yet.</li>'
            return
          }
          data.artifacts.forEach(a => {
            const li = document.createElement('li')
            const link = document.createElement('a')
            link.href = 'http://localhost:8000' + a.path
            link.textContent = a.name + ` (${a.size} bytes)`
            link.target = '_blank'
            li.appendChild(link)
            artifactsEl.appendChild(li)
          })
        } catch (err) {
          artifactsEl.innerHTML = '<li>Error fetching artifacts</li>'
        }
      }

      refreshBtn.onclick = refreshArtifacts
      // initial load
      refreshArtifacts()
    </script>
  </body>
</html>
