<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>r3f — AI Game Maker (UI)</title>
    <style>
      body { font-family: system-ui, Arial; margin: 24px; }
      textarea { width: 100%; height: 120px; }
      pre { background: #f6f8fa; padding: 12px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>r3f — AI Game Maker (UI)</h1>
    <p>Type a description of the game you want and click Generate.</p>
    <textarea id="prompt" placeholder="e.g. Create a small 2D platformer with double jump and 3 enemy types"></textarea>
    <div style="margin-top:8px">
      <button id="generate">Generate</button>
      <span id="status" style="margin-left:12px"></span>
    </div>

    <h2>Result</h2>
    <pre id="result">No output yet.</pre>

    <script>
      const generateBtn = document.getElementById('generate')
      const promptEl = document.getElementById('prompt')
      const resultEl = document.getElementById('result')
      const statusEl = document.getElementById('status')

      generateBtn.onclick = async () => {
        const prompt = promptEl.value.trim()
        if (!prompt) return alert('Please enter a prompt')
        statusEl.textContent = 'Sending...'
        try {
          const res = await fetch('http://localhost:8000/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          })
          const data = await res.json()
          resultEl.textContent = JSON.stringify(data, null, 2)
          statusEl.textContent = 'Done'
        } catch (err) {
          resultEl.textContent = String(err)
          statusEl.textContent = 'Error'
        }
      }
    </script>
  </body>
</html>
